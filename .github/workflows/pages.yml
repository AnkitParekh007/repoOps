name: Deploy project website
on:
  push:
    branches: [main]
    paths: ['website-react/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify React site
        working-directory: website-react
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website-react/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$count" = 1 ]; then
                echo "Pages artifact is visible to the REST API."
                sleep 10
              exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::Pages artifact metadata did not become available"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
